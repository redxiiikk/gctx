[tools]
go = "1.26.2"
goreleaser = "latest"

[tasks.build]
description = "Build the CLI"
run = "goreleaser build --snapshot --clean --single-target"

[tasks.test]
description = "Run all unit tests"
run = "go test ./..."

[tasks.lint]
description = "Format all Go source files"
run = "gofmt -w -s ."

[tasks.gctx]
run = "go run ./cmd/gctx gctx"
raw_args = true

[tasks.git]
run = "go run ./cmd/gctx"
raw_args = true
